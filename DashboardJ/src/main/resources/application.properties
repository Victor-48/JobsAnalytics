spring.application.name=DashboardJ

server.port=8080

# Memgraph (Bolt protocol)
graph.uri=bolt://localhost:7687
graph.username=memgraph
graph.password=

# JWT Configuration
jwt.secret=${JWT_SECRET}

# LLM Configuration
llm.provider=google
ollama.api.url=http://localhost:11434
ollama.model=llama3.2
google.api.key=${GOOGLE_API_KEY:}

# Web Search API
tavily.api.key=${TAVILY_API_KEY:}

# LangChain4j Configuration - Ollama
langchain4j.ollama.chat-model.base-url=${ollama.api.url}
langchain4j.ollama.chat-model.model-name=${ollama.model}
langchain4j.ollama.chat-model.temperature=0.0
langchain4j.ollama.chat-model.format=json

# LangChain4j Configuration - Google Vertex AI / Gemini
# Note: LangChain4j Google integration usually expects credentials via GOOGLE_APPLICATION_CREDENTIALS
# We will construct the model programmatically to pass the simple API key cleanly.